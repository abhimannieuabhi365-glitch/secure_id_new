<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Add Internal Marks</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
{% block body %}
<body>
<form action="/reply_to_student_post/{{ id }}" method="post" enctype="multipart/form-data">
  {% csrf_token %}
  <table width="432" height="281" border="1" class="table table-secondary">
    <tr align="center" class="table-dark">
      <th colspan="2" scope="col">SEND REPLY</th>
    </tr>


    <tr align="center">
      <td>REPLY </td>
      <td><input name="reply" type="text" class="form-control" maxlength="200" required /></td>
    </tr>
       <tr align="center">
      <td colspan="2"><input name="button" type="submit" class="form-control btn-success" value="Add" /></td>
    </tr>

  </table>
</form>
</body>
{% endblock %}
</html>
